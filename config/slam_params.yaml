slam_toolbox:
  ros__parameters:
    use_sim_time: true
    scan_topic: /scan
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    mode: mapping
    transform_timeout: 1.0
    tf_buffer_duration: 30.0
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05
    map_update_interval: 1.0
